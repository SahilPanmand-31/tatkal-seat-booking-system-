# Tests run on in-memory H2 in PostgreSQL mode, so no database needs to be installed.
spring:
  datasource:
    url: jdbc:h2:mem:tatkal;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  jwt:
    secret: test-secret-test-secret-test-secret-123456
    expiration-minutes: 60
  admin:
    email: admin@test.local
    password: admin-test
  seed:
    enabled: false
