# All secrets come from environment variables. The defaults below are placeholders for local use only.
spring:
  application:
    name: tatkal-seat-booking-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tatkal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-of-32-plus-chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  admin:
    email: ${ADMIN_EMAIL:admin@tatkal.local}
    password: ${ADMIN_PASSWORD:change-me}
  seed:
    enabled: ${SEED_DATA:true}
